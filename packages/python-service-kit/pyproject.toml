[project]
name = "techm-service-kit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "PyJWT[crypto]==2.10.1",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
